openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lanesight
    description: Live San Francisco bicycle route and street data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /lanesight/bikeways:
    get:
      operationId: getBikeNetwork
      tags: [lanesight]
      summary: Get the official San Francisco bikeway network
      responses:
        "200":
          description: City bikeway segments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BikeNetworkResponse"
        "502":
          description: City bikeway data could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /lanesight/stations:
    get:
      operationId: getBikeStations
      tags: [lanesight]
      summary: Get current Bay Wheels station availability in San Francisco
      responses:
        "200":
          description: Live station availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BikeStationsResponse"
        "502":
          description: Bay Wheels status could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /lanesight/conditions:
    get:
      operationId: getStreetConditions
      tags: [lanesight]
      summary: Get current permitted street restrictions and recent open 311 reports
      responses:
        "200":
          description: Recent official reports and permitted restrictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreetConditionsResponse"
        "502":
          description: Street condition data could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /lanesight/route:
    post:
      operationId: planBikeRoute
      tags: [lanesight]
      summary: Citywide SF bicycle route with SFMTA facility attribution and optional alternatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BikeRouteRequest"
      responses:
        "200":
          description: One or two attributed bicycle routes (More lanes / Faster when distinct)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanBikeRouteResult"
        "400":
          description: Invalid route request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: A place could not be found within San Francisco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Geocoding or bicycle routing service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Coordinate:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
    LineString:
      type: object
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/Coordinate"
      required: [type, coordinates]
    BikeLaneSegment:
      type: object
      properties:
        id:
          type: string
        streetName:
          type: string
        facilityType:
          type: string
        symbology:
          type: string
        fromStreet:
          type: ["string", "null"]
        toStreet:
          type: ["string", "null"]
        sharrow:
          type: boolean
        buffered:
          type: boolean
        raised:
          type: boolean
        contraflow:
          type: boolean
        direction:
          type: ["string", "null"]
          description: Compass direction of travel for this SFMTA feature.
        direct:
          type: ["string", "null"]
          description: Whether the mapped facility is one-way or two-way.
        dataAsOf:
          type: ["string", "null"]
        geometry:
          $ref: "#/components/schemas/LineString"
      required:
        - id
        - streetName
        - facilityType
        - symbology
        - sharrow
        - buffered
        - raised
        - contraflow
        - direction
        - direct
        - geometry
    BikeNetworkResponse:
      type: object
      properties:
        sourceUpdatedAt:
          type: string
        total:
          type: integer
        segments:
          type: array
          items:
            $ref: "#/components/schemas/BikeLaneSegment"
      required: [sourceUpdatedAt, total, segments]
    BikeStation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: ["string", "null"]
        latitude:
          type: number
        longitude:
          type: number
        bikesAvailable:
          type: integer
        ebikesAvailable:
          type: integer
        docksAvailable:
          type: integer
        capacity:
          type: ["integer", "null"]
        isRenting:
          type: boolean
        isReturning:
          type: boolean
        lastReported:
          type: string
      required:
        - id
        - name
        - latitude
        - longitude
        - bikesAvailable
        - ebikesAvailable
        - docksAvailable
        - isRenting
        - isReturning
        - lastReported
    BikeStationsResponse:
      type: object
      properties:
        fetchedAt:
          type: string
        updatedAt:
          type: string
        ttlSeconds:
          type: integer
        stations:
          type: array
          items:
            $ref: "#/components/schemas/BikeStation"
      required: [fetchedAt, updatedAt, ttlSeconds, stations]
    StreetClosure:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
        startAt:
          type: string
        endAt:
          type: string
        street:
          type: string
        fromStreet:
          type: ["string", "null"]
        toStreet:
          type: ["string", "null"]
        locationDescription:
          type: string
        laneImpact:
          type: string
        geometry:
          $ref: "#/components/schemas/LineString"
      required:
        - id
        - name
        - type
        - status
        - startAt
        - endAt
        - street
        - locationDescription
        - laneImpact
        - geometry
    StreetReport:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        detail:
          type: string
        address:
          type: string
        status:
          type: string
        reportedAt:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - id
        - category
        - detail
        - address
        - status
        - reportedAt
        - latitude
        - longitude
    StreetConditionsResponse:
      type: object
      properties:
        fetchedAt:
          type: string
        closures:
          type: array
          items:
            $ref: "#/components/schemas/StreetClosure"
        reports:
          type: array
          items:
            $ref: "#/components/schemas/StreetReport"
      required: [fetchedAt, closures, reports]
    BikeRouteRequest:
      type: object
      properties:
        origin:
          type: string
          minLength: 2
          maxLength: 160
        destination:
          type: string
          minLength: 2
          maxLength: 160
      required: [origin, destination]
    RouteEndpoint:
      type: object
      properties:
        label:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [label, latitude, longitude]
    RouteFacility:
      type: string
      enum: [protected, bike_lane, shared, ordinary]
    RouteSegmentSource:
      type: string
      enum: [sfmta, unmatched]
    RouteSegment:
      type: object
      properties:
        coordinates:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Coordinate"
        distanceMeters:
          type: number
        facility:
          $ref: "#/components/schemas/RouteFacility"
        designated:
          type: boolean
        source:
          $ref: "#/components/schemas/RouteSegmentSource"
      required: [coordinates, distanceMeters, facility, designated, source]
    RouteTransition:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        fromFacility:
          $ref: "#/components/schemas/RouteFacility"
        toFacility:
          $ref: "#/components/schemas/RouteFacility"
        warning:
          type: string
      required: [latitude, longitude, fromFacility, toFacility, warning]
    BikeRouteResponse:
      type: object
      properties:
        origin:
          $ref: "#/components/schemas/RouteEndpoint"
        destination:
          $ref: "#/components/schemas/RouteEndpoint"
        label:
          type: string
          description: Display label such as More lanes or Faster
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        designatedPercent:
          type: number
        mixedTrafficMeters:
          type: number
        transitionCount:
          type: integer
        profile:
          type: string
        source:
          type: string
        laneDistanceMeters:
          type: number
          description: Distance on designated SFMTA facilities (Class I/II/IV)
        connectorDistanceMeters:
          type: number
          description: Distance not on designated facilities (ordinary/shared)
        networkUpdatedAt:
          type: string
        laneCoordinates:
          type: array
          items:
            $ref: "#/components/schemas/Coordinate"
          description: Concatenated designated segment geometry
        connectorCoordinates:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Coordinate"
          description: Non-designated polylines for map styling
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/Coordinate"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/RouteSegment"
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/RouteTransition"
      required:
        - origin
        - destination
        - label
        - distanceMeters
        - durationSeconds
        - designatedPercent
        - mixedTrafficMeters
        - transitionCount
        - profile
        - source
        - laneDistanceMeters
        - connectorDistanceMeters
        - networkUpdatedAt
        - laneCoordinates
        - connectorCoordinates
        - coordinates
        - segments
        - transitions
    PlanBikeRouteResult:
      type: object
      properties:
        selectedIndex:
          type: integer
          minimum: 0
        routes:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/BikeRouteResponse"
      required: [selectedIndex, routes]

