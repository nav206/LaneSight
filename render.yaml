# One-click API host for the GitHub Pages UI.
# Connect this repo in Render → Blueprint, then set GitHub secret
# VITE_API_BASE_URL to the service URL (no trailing slash).
services:
  - type: web
    name: lanesight-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
